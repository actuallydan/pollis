appId: com.pollis.mobile
tags:
  - parity
---
# SECURITY — device list + safety/blocked entry points. Self-contained
# (revoke/verify need a peer or a second device; captured visually here).

- runFlow: ../subflows/sign-in.yaml
- tapOn:
    id: "tab-self"
- tapOn:
    id: "row-self-security"
- assertVisible:
    id: "screen-self-security"
- takeScreenshot: security-01-devices
# Account key: the transparency check renders a verdict. Which one depends
# on the live log, so assert the line, not the status.
# The verdict is a network check, so scroll to its section first and then
# wait for it; scrolling for the line itself can pass it before it renders.
- scrollUntilVisible:
    element:
      id: "section-account-key"
    visibilityPercentage: 50
    centerElement: true
- extendedWaitUntil:
    visible:
      id: "text-account-key-audit"
    timeout: 30000
- takeScreenshot: security-01b-account-key
# Blocked-users list.
- tapOn:
    id: "row-blocked-users"
    optional: true
- takeScreenshot: security-02-blocked
